name: "Detect Changes"
description: "Outputs skip=true if the PR only touches docs/changelog files"
outputs:
  skip:
    description: "Whether to skip CI jobs"
    value: ${{ steps.check.outputs.skip }}
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - id: check
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" != "pull_request" ]]; then
          echo "skip=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -qvE '^(docs/|CHANGELOG\.md|.*\.md$)'; then
          echo "skip=false" >> "$GITHUB_OUTPUT"
        else
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi
