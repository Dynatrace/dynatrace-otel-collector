name: Send release notification
description: POST a signed release payload to the DTP public release ingestion API via SigV4 + HMAC

inputs:
  component:
    description: Component name used in the payload (e.g. dynatrace-otel-collector)
    required: true
  ghcr_prefix:
    description: GHCR image prefix (e.g. ghcr.io/dynatrace/dynatrace-otel-collector/dynatrace-otel-collector)
    required: true
  artifacts_file:
    description: Path to the goreleaser artifacts.json file
    required: false
    default: ./dist/artifacts.json
  aws_region:
    description: AWS region for role assumption and SigV4 signing
    required: false
    default: eu-central-1
  role_arn:
    description: IAM role ARN to assume for API Gateway invocation (execute-api:Invoke)
    required: true
  hmac_secret:
    description: HMAC shared secret for request signing
    required: true
  api_url:
    description: Release ingestion API Gateway URL
    required: true

runs:
  using: composite
  steps:
    - name: Configure AWS credentials for release ingestion
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      with:
        role-to-assume: ${{ inputs.role_arn }}
        aws-region: ${{ inputs.aws_region }}

    - name: Send release notification
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        GHCR_PREFIX: ${{ inputs.ghcr_prefix }}
        ARTIFACTS_FILE: ${{ inputs.artifacts_file }}
        HMAC_SECRET: ${{ inputs.hmac_secret }}
        API_URL: ${{ inputs.api_url }}
        AWS_REGION: ${{ inputs.aws_region }}
      run: python3 ${{ github.action_path }}/send_release_notification.py
