name: Send release notification
description: POST a signed release payload to the DTP public release ingestion API via SigV4 + HMAC

inputs:
  component:
    description: Component name used in the payload (e.g. dynatrace-otel-collector)
    required: true
  ghcr_prefix:
    description: GHCR image prefix to match in digests.txt (e.g. ghcr.io/dynatrace/dynatrace-otel-collector/dynatrace-otel-collector)
    required: true
  digests_file:
    description: Path to the goreleaser digests file
    required: false
    default: ./dist/digests.txt
  aws_region:
    description: AWS region for role assumption and SigV4 signing
    required: false
    default: eu-central-1
  role_arn:
    description: IAM role ARN to assume for API Gateway invocation (execute-api:Invoke)
    required: true
  hmac_secret:
    description: HMAC shared secret for request signing
    required: true
  api_url:
    description: Release ingestion API Gateway URL
    required: true
  tag:
    description: Release tag (e.g. v0.54.0). Defaults to GITHUB_REF_NAME if omitted.
    required: false
    default: ${{ github.ref_name }}

runs:
  using: composite
  steps:
    - name: Debug OIDC claims
      shell: bash
      env:
        AUDIENCE: "${{ github.server_url }}/${{ github.repository }}"
      run: |
        TOKEN_JSON=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")
        ID_TOKEN=$(echo "$TOKEN_JSON" | jq -r .value)
        echo "$ID_TOKEN" | awk -F. '{print $2}' | base64 -d 2>/dev/null | jq -r

    - name: Configure AWS credentials for release ingestion
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      with:
        role-to-assume: ${{ inputs.role_arn }}
        aws-region: ${{ inputs.aws_region }}

    - name: Send release notification
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        GHCR_PREFIX: ${{ inputs.ghcr_prefix }}
        DIGESTS_FILE: ${{ inputs.digests_file }}
        HMAC_SECRET: ${{ inputs.hmac_secret }}
        API_URL: ${{ inputs.api_url }}
        AWS_REGION: ${{ inputs.aws_region }}
        GITHUB_REF_NAME: ${{ inputs.tag || github.ref_name }}
      run: python3 ${{ github.action_path }}/send_release_notification.py
