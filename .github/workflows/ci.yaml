name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

env:
  # renovate: datasource=golang-version depName=go
  GO_VERSION: "1.27.3"

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yaml

  build:
    name: Build and Test
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: needs.detect-changes.outputs.skip != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Go caches are restored and saved by the steps below.
          cache: false

      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-linux-amd64-${{ env.GO_VERSION }}-${{ hashFiles('manifest.yaml', '**/go.sum') }}
          restore-keys: |
            go-linux-amd64-${{ env.GO_VERSION }}-

      - name: Install tools
        run: |
          mkdir -p .tools
          make install-tools

      - name: Check license headers
        run: make checklicense

      - name: Generate source files
        run: make generate

      - name: Build
        run: make build

      - name: Print components
        run: make components

      - name: Verify
        run: make test

      # Only main saves the cache, so all PRs and merge queue entries restore
      # it. It is shared with the e2e and snapshot linux/amd64 builds, which use
      # the same goreleaser build flags.
      - name: Save Go cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  notify-slack:
    runs-on: ubuntu-24.04
    needs: [build]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: "DT OTel Collector Distro - CI Failure"
          SLACK_COLOR: "failure"
          SLACK_USERNAME: "GitHub Actions Notifier"
          SLACK_ICON: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/github.png"
