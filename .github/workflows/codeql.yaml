name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "27 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # renovate: datasource=golang-version depName=go
  GO_VERSION: "1.27.3"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            # The collector sources are generated into build/ by make generate,
            # so the Go code can not be autobuilt from the repository root.
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/*.sum"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # make generate builds the OpenTelemetry Collector builder on demand, so
      # there is no need for make install-tools (GoReleaser Pro, cosign, ...).
      - name: Generate source files
        if: matrix.language == 'go'
        run: make generate

      # Plain go build instead of make build, which goes through GoReleaser Pro.
      - name: Build
        if: matrix.language == 'go'
        run: |
          for mod in build $(find ./internal -name go.mod -not -path "./internal/tools/*" -exec dirname {} \;); do
            (cd "$mod" && go build ./...)
          done

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
