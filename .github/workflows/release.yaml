name: Release

on:
  push:
    # run only against version tags
    tags:
      - 'v*'
  # TEMP: manual trigger to test the "Send release notification" step against an
  # already-published release, without cutting a new one. Remove before merging.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to send a notification for, e.g. v0.54.0"
        required: true

env:
  # renovate: datasource=golang-version depName=go
  GO_VERSION: "1.26.5"
  # renovate: datasource=go depName=github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod
  CYCLONEDX_VERSION: "v1.10.0"
  # renovate: datasource=github-releases depName=goreleaser/goreleaser-pro
  GORELEASER_PRO_VERSION: v2.17.1
  # renovate: datasource=github-releases depName=sigstore/cosign
  COSIGN_VERSION: v3.1.3

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: write
      packages: write
      attestations: write
      artifact-metadata: write
    # TEMP: GITHUB_REF_NAME override so the notification step resolves the right
    # version when this is run via workflow_dispatch instead of a tag push.
    env:
      GITHUB_REF_NAME: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # TEMP: fabricate digests.txt since goreleaser didn't run - resolves the
      # real GHCR manifest-list digest for the tag being tested.
      - name: Build digests.txt for manual test
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          REF="ghcr.io/dynatrace/dynatrace-otel-collector/dynatrace-otel-collector:${VERSION}"
          DIGEST=$(docker buildx imagetools inspect "$REF" | awk '/^Digest:/{print $2; exit}')
          mkdir -p dist
          echo "${DIGEST#sha256:} ${REF}" > dist/digests.txt
          cat dist/digests.txt

      - name: Send release notification
        uses: ./.github/actions/send-release-notification
        with:
          component: dynatrace-otel-collector
          ghcr_prefix: ghcr.io/dynatrace/dynatrace-otel-collector/dynatrace-otel-collector
          role_arn: ${{ secrets.RELEASE_INGESTION_ROLE_ARN }}
          hmac_secret: ${{ secrets.RELEASE_INGESTION_HMAC_SECRET }}
          api_url: ${{ vars.RELEASE_INGESTION_API_URL }}
