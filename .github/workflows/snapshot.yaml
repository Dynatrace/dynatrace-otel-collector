name: Build PR Snapshots

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=golang-version depName=go
  GO_VERSION: "1.27.3"
  # renovate: datasource=github-releases depName=goreleaser/goreleaser-pro
  GORELEASER_PRO_VERSION: v2.18.3

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yaml

  # The merge queue only builds and tests linux/amd64 to keep queue times short.
  matrix:
    name: Set up matrix
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      package-tests: ${{ steps.matrix.outputs.package-tests }}
    steps:
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "merge_group" ]; then
            build='{"goos":["linux"],"goarch":["amd64"]}'
            package_tests='{"os":["deb","rpm"],"arch":["amd64"]}'
          else
            build='{
              "goos": ["linux", "darwin"],
              "goarch": ["amd64", "arm64", "ppc64le", "s390x"],
              "exclude": [
                {"goos": "darwin", "goarch": "s390x"},
                {"goos": "darwin", "goarch": "ppc64le"}
              ],
              "include": [
                {"goos": "windows", "goarch": "amd64"}
              ]
            }'
            package_tests='{"os":["deb","rpm"],"arch":["amd64","arm64"]}'
          fi
          echo "build=$(jq -c . <<< "$build")" >> "$GITHUB_OUTPUT"
          echo "package-tests=$(jq -c . <<< "$package_tests")" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [detect-changes, matrix]
    if: needs.detect-changes.outputs.skip != 'true'
    strategy:
      matrix: ${{ fromJson(needs.matrix.outputs.build) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/*.sum"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.goarch != 'amd64'
        with:
          platforms: ${{ matrix.goarch }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install tools
        run: |
          mkdir -p .tools
          make install-tools

      - name: Free up disk space
        run: |
          df -h
          rm -r /opt/hostedtoolcache/CodeQL
          rm -r /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk
          rm -r /opt/hostedtoolcache/PyPy
          rm -r /opt/hostedtoolcache/Ruby
          rm -r /opt/hostedtoolcache/node
          sudo rm -r $ANDROID_HOME
          df -h

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser-pro
          version: ${{ env.GORELEASER_PRO_VERSION }}
          args: release --snapshot --clean --skip archive,sbom --fail-fast --split
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show produced artifacts
        run: ls -laR ./dist

      - if: always()
        name: Show FS usage (debugging)
        run: |
          df -h

      - name: Upload Pull Request Preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: otelcol_dynatrace_${{ matrix.goos }}_${{ matrix.goarch }}_${{ github.event.pull_request.number }}_${{ github.run_number }}
          path: dist/*

      - name: Upload linux service packages
        if: matrix.goarch == 'arm64' && matrix.goos == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages-arm64
          path: |
            dist/**/metadata.json
            dist/**/dynatrace-otel-collector_*_Linux_arm64.deb
            dist/**/dynatrace-otel-collector_*_Linux_arm64.rpm

      - name: Upload linux service packages
        if: matrix.goarch == 'amd64' && matrix.goos == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages-amd64
          path: |
            dist/**/metadata.json
            dist/**/dynatrace-otel-collector_*_Linux_x86_64.deb
            dist/**/dynatrace-otel-collector_*_Linux_x86_64.rpm

  linux-package-tests:
    name: Test Linux Packages
    runs-on: ubuntu-24.04
    needs: [matrix, build]
    strategy:
      matrix: ${{ fromJson(needs.matrix.outputs.package-tests) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64,ppc64le,s390x

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Download linux service packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages-${{ matrix.arch }}
          path: linux-packages

      - name: Parse metadata file
        id: parse-metadata
        run: |
          metadata=`cat ./linux-packages/linux_${{ matrix.arch }}/metadata.json`
          # make single-line json out of multi-line json
          metadata="${metadata//$'\n'/''}"
          metadata="${metadata//$'\r'/''}"
          echo "metadata=$metadata" >> "$GITHUB_OUTPUT"

      - name: Extract version number
        id: extract-version
        run: echo "version=${{ fromJson(steps.parse-metadata.outputs.metadata).version }}" >> "$GITHUB_OUTPUT"

      - name: Test amd64
        if: matrix.arch == 'amd64'
        run: make package-test ARCH=${{ matrix.arch }} PACKAGE_PATH=linux-packages/linux_${{ matrix.arch }}/dynatrace-otel-collector_${{ steps.extract-version.outputs.version }}_Linux_x86_64.${{ matrix.os }}

      - name: Test arm64
        if: matrix.arch == 'arm64'
        run: make package-test ARCH=${{ matrix.arch }} PACKAGE_PATH=linux-packages/linux_${{ matrix.arch }}/dynatrace-otel-collector_${{ steps.extract-version.outputs.version }}_Linux_${{ matrix.arch }}.${{ matrix.os }}

  # Single required status check. Skipped jobs (docs-only changes) count as
  # success, failed or cancelled ones fail this job.
  snapshot-success:
    name: Snapshot Success
    if: always()
    needs: [detect-changes, matrix, build, linux-package-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1;; esac
