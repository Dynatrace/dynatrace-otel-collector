receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  transform:
    trace_statements:
      - set(span.attributes["should-be-set"], "yes-its-set")
      - set(span.attributes["shouldnt-be-set"], nil)
      - set(span.attributes["also-shouldnt-be-set"], span.attributes["never-set-124872w23412"])

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform]
      exporters: [debug]