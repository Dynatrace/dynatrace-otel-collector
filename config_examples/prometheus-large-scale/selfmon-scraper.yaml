# Selfmon Scraper — scrapes collector/allocator metrics, exports direct to DT
# Deploy with:
#   helm install otel-selfmon open-telemetry/opentelemetry-collector \
#     --namespace $NAMESPACE -f selfmon-scraper.values.yaml

fullnameOverride: "selfmon-scraper"

mode: deployment
replicaCount: 1

image:
  repository: ghcr.io/dynatrace/dynatrace-otel-collector/dynatrace-otel-collector
  # renovate: datasource=docker depName=ghcr.io/dynatrace/dynatrace-otel-collector/dynatrace-otel-collector
  tag: 0.61.0@sha256:b27f025c5d8addd8ecdf57d1ce248ad585b1c84c86c2261e12aa0e6dde201b7b
command:
  name: dynatrace-otel-collector

# Don't scrape this scraper's own metrics (avoid recursion) — or set to true if you want it
podAnnotations:
  metrics.dynatrace.com/scrape: "false"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

service:
  enabled: true

clusterRole:
  create: false

serviceAccount:
  create: false
  name: tiered-otel-scraper  # reuse existing SA with pod list permissions

global:
  # Used for the k8s.cluster.name resource attribute (K8S_CLUSTER_NAME env var).
  # Intentionally empty, set it at install time: --set global.clusterName=<your-cluster>
  clusterName: ""

extraEnvsFrom:
  - secretRef:
      name: dynatrace-otelcol-credentials
extraEnvs:
  - name: K8S_CLUSTER_NAME
    value: "{{ .Values.global.clusterName }}"
  - name: K8S_NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  - name: K8S_POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  - name: K8S_NAMESPACE_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  - name: K8S_POD_UID
    valueFrom:
      fieldRef:
        fieldPath: metadata.uid

alternateConfig:
  extensions:
    health_check:
      endpoint: "${env:MY_POD_IP}:13133"

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "${env:MY_POD_IP}:4317"
        http:
          endpoint: "${env:MY_POD_IP}:4318"
    prometheus:
      config:
        scrape_configs:
          - job_name: otel-selfmon
            scrape_interval: 15s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - ${NAMESPACE}
            relabel_configs:
              # Keep only pods with scrape annotation
              - source_labels: [__meta_kubernetes_pod_annotation_metrics_dynatrace_com_scrape]
                action: keep
                regex: "true"
              # Use custom port from annotation
              - source_labels: [__address__, __meta_kubernetes_pod_annotation_metrics_dynatrace_com_port]
                action: replace
                regex: (.+?)(?::\d+)?;(\d+)
                target_label: __address__
                replacement: $1:$2
              # Drop terminated pods
              - source_labels: [__meta_kubernetes_pod_phase]
                action: drop
                regex: (Failed|Succeeded)
              # Add pod name label
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: k8s_pod_name
              # Add pod IP for k8sattributes matching
              - source_labels: [ __meta_kubernetes_pod_ip ]
                target_label: k8s_pod_ip
              #  Add namespace
              - source_labels: [ __meta_kubernetes_namespace ]
                target_label: k8s_namespace_name

  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 20
    metric_start_time:
    cumulative_to_delta:
      max_staleness: 10m
      initial_value: drop
    k8s_attributes:
      # Enable passthrough mode - doesn't require matching existing attributes
      passthrough: false

      # How to find the pod - ORDER MATTERS
      extract:
        annotations:
          - from: pod
            key_regex: metadata.dynatrace.com/(.*)
            tag_name: $$1
          - from: pod
            key: metadata.dynatrace.com
            tag_name: metadata.dynatrace.com
        metadata:
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.pod.ip
          - k8s.deployment.name
          - k8s.replicaset.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.job.name
          - k8s.cronjob.name
          - k8s.namespace.name
          - k8s.node.name
          - k8s.cluster.uid
          - k8s.container.name
          - k8s.deployment.uid
          - k8s.replicaset.uid
          - k8s.statefulset.uid
          - k8s.daemonset.uid
          - k8s.job.uid
          - k8s.cronjob.uid
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.name
            - from: resource_attribute
              name: k8s.namespace.name
        - sources:
            - from: resource_attribute
              name: k8s.pod.ip
        - sources:
            - from: resource_attribute
              name: k8s.pod.uid
        - sources:
            - from: connection

    transform/selfmon_rename:
      metric_statements:
        - statements:
            # Dynatrace dashboards expect attributes to be dotted, but Prometheus uses underscores.
            - replace_all_patterns(resource.attributes, "key", "_", ".")

    transform:
      metric_statements:

        - context: datapoint
          statements:
            - set(resource.attributes["k8s.pod.name"], datapoint.attributes["k8s_pod_name"]) where datapoint.attributes["k8s_pod_name"] != nil
            - set(resource.attributes["k8s.namespace.name"], datapoint.attributes["k8s_namespace_name"]) where datapoint.attributes["k8s_namespace_name"] != nil
            - set(resource.attributes["k8s.pod.ip"], datapoint.attributes["k8s_pod_ip"]) where datapoint.attributes["k8s_pod_ip"] != nil

        - context: resource
          statements:
            - set(resource.attributes["k8s.workload.name"], resource.attributes["k8s.statefulset.name"]) where IsString(resource.attributes["k8s.statefulset.name"])
            - set(resource.attributes["k8s.workload.name"], resource.attributes["k8s.replicaset.name"]) where IsString(resource.attributes["k8s.replicaset.name"])
            - set(resource.attributes["k8s.workload.name"], resource.attributes["k8s.job.name"]) where IsString(resource.attributes["k8s.job.name"])
            - set(resource.attributes["k8s.workload.name"], resource.attributes["k8s.deployment.name"]) where IsString(resource.attributes["k8s.deployment.name"])
            - set(resource.attributes["k8s.workload.name"], resource.attributes["k8s.daemonset.name"]) where IsString(resource.attributes["k8s.daemonset.name"])
            - set(resource.attributes["k8s.workload.name"], resource.attributes["k8s.cronjob.name"]) where IsString(resource.attributes["k8s.cronjob.name"])

            - set(resource.attributes["k8s.workload.kind"], "statefulset") where IsString(resource.attributes["k8s.statefulset.name"])
            - set(resource.attributes["k8s.workload.kind"], "replicaset") where IsString(resource.attributes["k8s.replicaset.name"])
            - set(resource.attributes["k8s.workload.kind"], "job") where IsString(resource.attributes["k8s.job.name"])
            - set(resource.attributes["k8s.workload.kind"], "deployment") where IsString(resource.attributes["k8s.deployment.name"])
            - set(resource.attributes["k8s.workload.kind"], "daemonset") where IsString(resource.attributes["k8s.daemonset.name"])
            - set(resource.attributes["k8s.workload.kind"], "cronjob") where IsString(resource.attributes["k8s.cronjob.name"])

            - set(resource.attributes["k8s.workload.uid"], resource.attributes["k8s.statefulset.uid"]) where IsString(resource.attributes["k8s.statefulset.uid"])
            - set(resource.attributes["k8s.workload.uid"], resource.attributes["k8s.replicaset.uid"]) where IsString(resource.attributes["k8s.replicaset.uid"])
            - set(resource.attributes["k8s.workload.uid"], resource.attributes["k8s.job.uid"]) where IsString(resource.attributes["k8s.job.uid"])
            - set(resource.attributes["k8s.workload.uid"], resource.attributes["k8s.deployment.uid"]) where IsString(resource.attributes["k8s.deployment.uid"])
            - set(resource.attributes["k8s.workload.uid"], resource.attributes["k8s.daemonset.uid"]) where IsString(resource.attributes["k8s.daemonset.uid"])
            - set(resource.attributes["k8s.workload.uid"], resource.attributes["k8s.cronjob.uid"]) where IsString(resource.attributes["k8s.cronjob.uid"])

            - delete_key(resource.attributes, "k8s.statefulset.name")
            - delete_key(resource.attributes, "k8s.replicaset.name")
            - delete_key(resource.attributes, "k8s.job.name")
            - delete_key(resource.attributes, "k8s.deployment.name")
            - delete_key(resource.attributes, "k8s.daemonset.name")
            - delete_key(resource.attributes, "k8s.cronjob.name")
            - delete_key(resource.attributes, "k8s.statefulset.uid")
            - delete_key(resource.attributes, "k8s.replicaset.uid")
            - delete_key(resource.attributes, "k8s.deployment.uid")
            - delete_key(resource.attributes, "k8s.daemonset.uid")
            - delete_key(resource.attributes, "k8s.job.uid")
            - delete_key(resource.attributes, "k8s.cronjob.uid")

        - context: resource
          statements:
            - delete_key(resource.attributes, "processor")
            - delete_key(resource.attributes, "otel.signal")
            - delete_key(resource.attributes, "otel.scope.name")
            - delete_key(resource.attributes, "otel.scope.version")

        - context: resource
          statements:
            - set(resource.attributes["k8s.cluster.name"], "${env:K8S_CLUSTER_NAME}") where resource.attributes["k8s.cluster.name"] == nil and Len("${env:K8S_CLUSTER_NAME}") > 0

        - context: resource
          statements:
            - merge_maps(resource.attributes, ParseJSON(resource.attributes["metadata.dynatrace.com"]), "upsert") where IsMatch(resource.attributes["metadata.dynatrace.com"], "^\\{")
            - delete_key(resource.attributes, "metadata.dynatrace.com")

    # Allowlist of self-monitoring metrics. Union of:
    #   - Customer-facing/Local/Remote SFM list (customer tenant column)
    #     https://dt-rnd.atlassian.net/wiki/spaces/PPX/pages/3154018602
    #   - SFM metrics for Prometheus integration in Kubernetes (dashboard metrics)
    #     https://dt-rnd.atlassian.net/wiki/spaces/ICP/pages/3429630181
    # Everything not listed here is dropped.
    # Prometheus-scraped histograms arrive without the "_bucket" suffix; counters
    # may or may not keep "_total" depending on prometheus receiver feature gates,
    # so both variants are listed where relevant.
    filter/selfmon_allowlist:
      error_mode: ignore
      metrics:
        metric:
          - |
            not ContainsValue([
              "otelcol_process_uptime",
              "otelcol_process_cpu_seconds",
              "otelcol_process_memory_rss",
              "otelcol_process_runtime_heap_alloc_bytes",
              "otelcol_process_runtime_total_alloc_bytes",
              "otelcol_process_runtime_total_sys_memory_bytes",
              "otelcol_receiver_accepted_log_records",
              "otelcol_receiver_refused_log_records",
              "otelcol_receiver_failed_log_records",
              "otelcol_receiver_accepted_metric_points",
              "otelcol_receiver_refused_metric_points",
              "otelcol_receiver_failed_metric_points",
              "otelcol_receiver_accepted_spans",
              "otelcol_receiver_refused_spans",
              "otelcol_receiver_failed_spans",
              "otelcol_exporter_sent_log_records",
              "otelcol_exporter_send_failed_log_records",
              "otelcol_exporter_sent_metric_points",
              "otelcol_exporter_send_failed_metric_points",
              "otelcol_exporter_sent_spans",
              "otelcol_exporter_send_failed_spans",
              "otelcol_exporter_queue_size",
              "otelcol_exporter_queue_capacity",
              "otelcol_exporter_queue_batch_send_size",
              "otelcol_exporter_queue_batch_send_size_bytes",
              "otelcol_exporter_raw_bytes",
              "otelcol_processor_filter_logs.filtered",
              "otelcol_processor_filter_datapoints.filtered",
              "otelcol_processor_filter_spans.filtered",
              "otelcol_processor_internal_duration",
              "otelcol_processor_incoming_items",
              "otelcol_processor_outgoing_items",
              "otelcol.k8s.watcher.pod_cache.size",
              "otelcol_otelsvc_k8s_pod_table_size",
              "otelcol_loadbalancer_backend_latency",
              "otelcol_loadbalancer_backend_outcome",
              "otelcol_loadbalancer_num_backends",
              "http.server.request.duration",
              "http.server.request.body.size",
              "http.client.request.duration",
              "http.client.request.body.size",
              "rpc.server.call.duration",
              "rpc.client.call.duration",
              "otelcol_dtedgeprocessing_receive_batch_compressed_size",
              "otelcol_dtedgeprocessing_receive_batch_uncompressed_size",
              "otelcol_dtedgeprocessing_receive_request_size",
              "otelcol_dtedgeprocessing_receive_batch_deserialization_duration",
              "otelcol_dtedgeprocessing_export_batch_compressed_size",
              "otelcol_dtedgeprocessing_export_batch_uncompressed_size",
              "otelcol_dtedgeprocessing_export_raw_bytes",
              "otelcol_dtedgeprocessing_export_conversion_duration",
              "opentelemetry_allocator_collectors_allocatable",
              "opentelemetry_allocator_collectors_discovered",
              "opentelemetry_allocator_http_duration_seconds",
              "opentelemetry_allocator_process_target_groups_duration_seconds",
              "opentelemetry_allocator_process_targets_duration_seconds",
              "opentelemetry_allocator_targets_per_collector",
              "opentelemetry_allocator_targets_remaining",
              "opentelemetry_allocator_time_to_allocate",
              "process_cpu_seconds",
              "process_cpu_seconds_total",
              "process_resident_memory_bytes",
              "scrape_duration_seconds",
              "scrape_samples_post_metric_relabeling",
              "up"
            ], metric.name)

    # Strips all attributes that are not explicitly allowed, then tags the data.
    transform/selfmon_attributes:
      error_mode: ignore
      metric_statements:
        # Resource attributes are shared by all metrics of a resource, so this is
        # the union of what both lists need. k8s.pod.name is required by the
        # Prometheus dashboard list; service.version by otelcol_process_uptime.
        - context: resource
          statements:
            - keep_keys(resource.attributes, ["service.name", "service.instance.id", "service.version", "k8s.cluster.name", "k8s.namespace.name", "k8s.workload.name", "k8s.pod.name"])
            # TODO: double-check whether "dynatrace-operator" is what we want here, or
            # whether we should/can include the Operator version (e.g. "dynatrace-operator/<version>").
            - set(resource.attributes["dt.managed_by"], "dynatrace-operator")

        # Data point attributes: keep only the metric-specific dimensions.
        - context: datapoint
          statements:
            - keep_keys(datapoint.attributes, ["receiver", "transport"]) where IsMatch(metric.name, "^otelcol_receiver_")
            - keep_keys(datapoint.attributes, ["exporter", "data_type"]) where metric.name == "otelcol_exporter_queue_size" or metric.name == "otelcol_exporter_queue_capacity"
            - keep_keys(datapoint.attributes, ["exporter", "configuration"]) where metric.name == "otelcol_exporter_raw_bytes"
            - keep_keys(datapoint.attributes, ["exporter"]) where IsMatch(metric.name, "^otelcol_exporter_") and not ContainsValue(["otelcol_exporter_queue_size", "otelcol_exporter_queue_capacity", "otelcol_exporter_raw_bytes"], metric.name)
            - keep_keys(datapoint.attributes, ["filter"]) where IsMatch(metric.name, "^otelcol_processor_filter_")
            - keep_keys(datapoint.attributes, ["processor", "otel.signal"]) where metric.name == "otelcol_processor_internal_duration"
            - keep_keys(datapoint.attributes, ["processor"]) where metric.name == "otelcol_processor_incoming_items" or metric.name == "otelcol_processor_outgoing_items"
            - keep_keys(datapoint.attributes, ["success"]) where metric.name == "otelcol_loadbalancer_backend_outcome"
            - keep_keys(datapoint.attributes, ["http.request.method", "http.response.status_code", "http.route", "url.scheme", "network.protocol.name", "network.protocol.version"]) where IsMatch(metric.name, "^http\\.server\\.")
            - keep_keys(datapoint.attributes, ["http.request.method", "http.response.status_code", "url.scheme", "network.protocol.name", "network.protocol.version"]) where IsMatch(metric.name, "^http\\.client\\.")
            - keep_keys(datapoint.attributes, ["rpc.grpc.status_code", "rpc.response.status_code", "rpc.method", "rpc.service", "rpc.system", "network.protocol.name", "network.protocol.version"]) where IsMatch(metric.name, "^rpc\\.(server|client)\\.call\\.duration$")
            - keep_keys(datapoint.attributes, ["configuration"]) where IsMatch(metric.name, "^otelcol_dtedgeprocessing_")
            - keep_keys(datapoint.attributes, ["path"]) where metric.name == "opentelemetry_allocator_http_duration_seconds"
            - keep_keys(datapoint.attributes, ["collector_name"]) where metric.name == "opentelemetry_allocator_targets_per_collector"
            # All remaining allowlisted metrics carry no data point dimensions.
            - keep_keys(datapoint.attributes, []) where not (IsMatch(metric.name, "^(otelcol_receiver_|otelcol_exporter_|otelcol_processor_|otelcol_dtedgeprocessing_|http\\.(server|client)\\.|rpc\\.(server|client)\\.)") or ContainsValue(["otelcol_loadbalancer_backend_outcome", "opentelemetry_allocator_http_duration_seconds", "opentelemetry_allocator_targets_per_collector"], metric.name))

  exporters:
    otlphttp/dynatrace:
      endpoint: "${env:DT_ENDPOINT}"
      headers:
        Authorization: "Bearer ${env:DT_PLATFORM_TOKEN}"
      sending_queue:
        batch:
          min_size: 1000
          flush_timeout: 10s

  service:
    extensions:
      - health_check
    # Push this collector's own telemetry into its own OTLP receiver so it shows up
    # alongside the scraper and gateway tiers.
    telemetry:
      metrics:
        level: normal
        readers:
          - periodic:
              interval: 10000
              timeout: 5000
              exporter:
                otlp:
                  protocol: http/protobuf
                  temporality_preference: delta
                  endpoint: http://${env:MY_POD_IP}:4318
    pipelines:
      metrics:
        receivers:
          - otlp
          - prometheus
        processors:
          - memory_limiter
          - filter/selfmon_allowlist
          - transform/selfmon_rename
          - metric_start_time
          - cumulative_to_delta
          - k8s_attributes
          - transform
          - transform/selfmon_attributes
        exporters:
          - otlphttp/dynatrace
ports:
  otlp:
    enabled: true
  otlp-http:
    enabled: true
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: false
