receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: 'localhost'
          scrape_interval: 5s
          static_configs:
            - targets: ['localhost:9100']

processors:
  cumulative_to_delta:

exporters:
  debug:

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [cumulative_to_delta]
      exporters: [debug]
