# Negative-test sender: injects a static string that is not a valid JWT.
# The oidcauthextension rejects it at JWT parsing time (go-jose cannot parse
# the issuer from a non-JWT string) before signature verification runs.
extensions:
  bearertokenauth:
    token: "not.a.valid.jwt"
    scheme: "Bearer"
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  otlphttp:
    endpoint: ${env:DT_ENDPOINT}
    auth:
      authenticator: bearertokenauth

service:
  extensions: [bearertokenauth, health_check]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp]
