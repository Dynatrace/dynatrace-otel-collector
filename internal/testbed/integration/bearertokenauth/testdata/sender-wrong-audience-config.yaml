# Negative-test sender: bearer token is a genuine cluster-issued SA token,
# but projected with audience "wrong-audience-wif-test" instead of the
# expected "dynatrace-wif-test". The oidcauthextension rejects it with
# an audience mismatch error.
extensions:
  bearertokenauth:
    filename: /var/run/secrets/dynatrace/token
    scheme: "Bearer"
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  otlphttp:
    endpoint: ${env:DT_ENDPOINT}
    auth:
      authenticator: bearertokenauth

service:
  extensions: [bearertokenauth, health_check]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp]
