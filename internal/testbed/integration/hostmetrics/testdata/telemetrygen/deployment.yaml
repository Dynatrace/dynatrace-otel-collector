apiVersion: apps/v1
kind: Deployment
metadata:
  name: temeletrygen-deployment
  namespace: e2ehostmetrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temeletrygen-deployment
  template:
    metadata:
      annotations:
        workload: deployment
      labels:
        app: temeletrygen-deployment
    spec:
      containers:
      - command:
        - /telemetrygen
        - logs
        - --otlp-insecure
        - --otlp-endpoint=otelcolsvc.e2ehostmetrics.svc.cluster.local:4317
        - --duration=36000s
        - --rate=1
        - --batch=false
        - --otlp-attributes=service.name="test-logs-deployment"
        image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.163.0@sha256:569b79a39f8313db839a727e8eac161c66b8a6c2e633f2da4ad352ce7b383c23
        imagePullPolicy: IfNotPresent
        name: telemetrygen-logs
      restartPolicy: Always
