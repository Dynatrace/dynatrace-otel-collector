apiVersion: apps/v1
kind: Deployment
metadata:
  name: temeletrygen-deployment
  namespace: e2ehostmetrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temeletrygen-deployment
  template:
    metadata:
      annotations:
        workload: deployment
      labels:
        app: temeletrygen-deployment
    spec:
      containers:
      - command:
        - /telemetrygen
        - logs
        - --otlp-insecure
        - --otlp-endpoint=otelcolsvc.e2ehostmetrics.svc.cluster.local:4317
        - --duration=36000s
        - --rate=1
        - --batch=false
        - --otlp-attributes=service.name="test-logs-deployment"
        image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.166.0@sha256:991d61b8cd49382d912cbd9c58ba9759c6df8e7991ff8b5859ee5cc3cec433dc
        imagePullPolicy: IfNotPresent
        name: telemetrygen-logs
      restartPolicy: Always
