
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox-deployment
  namespace: e2ek8spodlogs
  labels:
    app: busybox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busybox
  template:
    metadata:
      labels:
        app: busybox
    spec:
      containers:
      - name: logger
        image: busybox@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        command: ["sh", "-c", "echo 'Hello from logger container!'"]
