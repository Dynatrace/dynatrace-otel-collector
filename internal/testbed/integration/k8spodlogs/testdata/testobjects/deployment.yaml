
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox-deployment
  namespace: e2ek8spodlogs
  labels:
    app: busybox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busybox
  template:
    metadata:
      labels:
        app: busybox
    spec:
      containers:
      - name: logger
        image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        command: ["sh", "-c", "echo 'Hello from logger container!'"]
