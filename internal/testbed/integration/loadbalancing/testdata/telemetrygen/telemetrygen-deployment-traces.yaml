apiVersion: apps/v1
kind: Deployment
metadata:
  name: temeletrygen-traces-deployment
  namespace: e2eloadbalancing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temeletrygen-traces-deployment
  template:
    metadata:
      annotations:
        workload: deployment
      labels:
        app: temeletrygen-traces-deployment
    spec:
      containers:
      - command:
        - /telemetrygen
        - traces
        - --otlp-insecure
        - --otlp-endpoint={{ .OTLPEndpoint }}
        - --duration=36000s
        - --rate=1
        - --batch=false
        - --otlp-attributes=service.name="test-traces-deployment"
        image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.165.1@sha256:69f8481157ac68a94429d7963f9579da2a17e78ba964b00b79bdde0038a42d44
        imagePullPolicy: IfNotPresent
        name: telemetrygen
      restartPolicy: Always
