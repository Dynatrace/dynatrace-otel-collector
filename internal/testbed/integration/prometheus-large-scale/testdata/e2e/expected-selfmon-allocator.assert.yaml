# Target Allocator pushes OTLP self-telemetry directly (no self-monitoring collector).
# Resource attributes come from OTEL_RESOURCE_ATTRIBUTES + OTEL_SERVICE_NAME env vars.
#
# NOTE: regenerate this file by uncommenting WriteAssertionFile in validateSelfmonSource
# and running the test once to capture the actual OTLP output.
version: 1
signal: metrics
resources:
    - attributes:
        k8s.cluster.name: prometheus-large-scale-test
        k8s.namespace.name: otel-ta
        k8s.node.name: '*'
        k8s.pod.name: '*'
        k8s.pod.uid: '*'
        k8s.workload.name: dtp-prometheus-allocator
        service.instance.id: '*'
        service.name: target-allocator
        telemetry.sdk.language: go
        telemetry.sdk.name: opentelemetry
        telemetry.sdk.version: '*'
      scopes:
        - name: targetallocator
          metrics:
            - name: opentelemetry_allocator_collectors_discovered
              type: gauge
            - name: opentelemetry_allocator_targets
              type: gauge
              datapoints:
                - attributes:
                    job_name: scrapeConfig/otel-ta/dynatrace-com
