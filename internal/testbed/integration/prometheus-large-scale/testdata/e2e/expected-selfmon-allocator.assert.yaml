# Target Allocator pushes OTLP self-telemetry directly (no self-monitoring collector).
# Resource attributes come from OTEL_RESOURCE_ATTRIBUTES + OTEL_SERVICE_NAME env vars.
#
# The targetallocator scope is asserted in full. The go.opentelemetry.io/contrib/bridges/prometheus
# scope is asserted with metrics/include (see below); scopes/include allows other scopes.
version: 1
signal: metrics
resources:
    - attributes:
        k8s.cluster.name: prometheus-large-scale-test
        k8s.namespace.name: otel-ta
        k8s.node.name: '*'
        k8s.pod.name: '*'
        k8s.pod.uid: '*'
        k8s.workload.name: dtp-prometheus-allocator-ta
        service.instance.id: '*'
        service.name: target-allocator
        service.version: '*'
        telemetry.sdk.language: go
        telemetry.sdk.name: opentelemetry
        telemetry.sdk.version: '*'
      scopes/include:
        - name: targetallocator
          metrics:
            - name: opentelemetry_allocator_collectors_allocatable
              type: gauge
              datapoints:
                - attributes:
                    strategy: consistent-hashing
            - name: opentelemetry_allocator_collectors_discovered
              type: gauge
            - name: opentelemetry_allocator_events
              type: sum
              temporality: delta
              monotonic: true
              datapoints:
                - attributes:
                    source: EventSourcePrometheusCR
            - name: opentelemetry_allocator_http_duration_seconds
              type: histogram
              temporality: delta
              datapoints:
                - attributes:
                    path: /jobs/:job_id/targets
                - attributes:
                    path: /livez
                - attributes:
                    path: /readyz
                - attributes:
                    path: /scrape_configs
            - name: opentelemetry_allocator_process_target_groups_duration_seconds
              type: histogram
              temporality: delta
              datapoints:
                - attributes:
                    job.name: scrapeConfig/otel-ta/dynatrace-com
            - name: opentelemetry_allocator_process_targets_duration_seconds
              type: histogram
              temporality: delta
            - name: opentelemetry_allocator_targets
              type: gauge
              datapoints:
                - attributes:
                    job.name: scrapeConfig/otel-ta/dynatrace-com
            - name: opentelemetry_allocator_targets_per_collector
              type: gauge
              datapoints:
                - attributes:
                    collector_name: '*'
                    strategy: consistent-hashing
            - name: opentelemetry_allocator_targets_remaining
              type: gauge
            - name: opentelemetry_allocator_time_to_allocate
              type: histogram
              temporality: delta
              datapoints:
                - attributes:
                    method: SetCollectors
                    strategy: consistent-hashing
                - attributes:
                    method: SetTargets
                    strategy: consistent-hashing
        # Prometheus bridge scope: Go runtime/process metrics vary by environment, so only the
        # two used by the Target Allocator CPU/memory dashboard tiles are asserted.
        - name: go.opentelemetry.io/contrib/bridges/prometheus
          metrics/include:
            - name: process_cpu_seconds_total
              type: sum
              temporality: delta
              monotonic: true
            - name: process_resident_memory_bytes
              type: gauge
