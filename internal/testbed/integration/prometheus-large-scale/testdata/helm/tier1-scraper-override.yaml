# Test-only override: redirect dtp-scraper self-telemetry directly to the
# scraper selfmon sink (port {{SELFMON_SCRAPER_HTTP_PORT}}).
# {{HOST}} and {{SELFMON_SCRAPER_HTTP_PORT}} are substituted by setup.sh.
alternateConfig:
  service:
    telemetry:
      metrics:
        readers:
          - periodic:
              interval: 10000
              timeout: 5000
              exporter:
                otlp:
                  protocol: http/protobuf
                  temporality_preference: delta
                  endpoint: http://{{HOST}}:{{SELFMON_SCRAPER_HTTP_PORT}}
