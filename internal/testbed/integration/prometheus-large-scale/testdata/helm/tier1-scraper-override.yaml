# Test-only override: redirect dtp-scraper self-telemetry directly to the
# scraper selfmon sink (port 4328).
# {{ .HostEndpoint }} is substituted by setup.sh; port 4328 = selfmonScraperHttpPort in e2e_test.go.
alternateConfig:
  service:
    telemetry:
      metrics:
        readers:
          - periodic:
              interval: 10000
              timeout: 5000
              exporter:
                otlp:
                  protocol: http/protobuf
                  temporality_preference: delta
                  endpoint: http://{{ .HostEndpoint }}:4328
