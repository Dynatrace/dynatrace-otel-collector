# Test-only override: redirect dtp-gateway self-telemetry directly to the
# gateway selfmon sink (port 4330).
# {{ .HostEndpoint }} is substituted by setup.sh; port 4330 = selfmonGatewayHttpPort in e2e_test.go.
alternateConfig:
  service:
    telemetry:
      metrics:
        readers:
          - periodic:
              interval: 10000
              timeout: 5000
              exporter:
                otlp:
                  protocol: http/protobuf
                  temporality_preference: delta
                  endpoint: http://{{ .HostEndpoint }}:4330
