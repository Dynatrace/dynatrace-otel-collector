apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Name }}-{{ .DataType}}-job
  namespace: e2eredaction
spec:
  template:
    metadata:
      annotations:
        workload: job
      labels:
        app: {{ .Name }}-{{ .DataType }}-job
    spec:
      containers:
        - command:
            - /telemetrygen
            - {{ .DataType }}
            - --otlp-insecure
            - --otlp-endpoint={{ .OTLPEndpoint }}
            - --rate=1
            - --duration=36000s
            - --otlp-attributes=service.name="test-{{ .DataType }}-job"
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.161.0@sha256:de5a352a31aaf103b70d6cca4001d0802e3fc2f902a9ea110ebe0bbe501000cb
          name: telemetrygen
      restartPolicy: OnFailure
