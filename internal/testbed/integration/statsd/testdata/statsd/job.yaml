apiVersion: batch/v1
kind: Job
metadata:
  name: statsd-generator-job
  namespace: e2estatsd
spec:
  template:
    spec:
      containers:
      - name: netcat
        image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
        command: ["/bin/sh", "-c"]
        args: [
          "echo 'test.metric:42|g|#myKey:myVal' | nc -u -w 1 -v otelcolsvc.e2estatsd.svc.cluster.local 8125 && \
           sleep 1 && \
           echo 'timerMetric:320|ms|@0.1|#timerKey:timerVal' | nc -u -w 1 -v otelcolsvc.e2estatsd.svc.cluster.local 8125"
        ]
      restartPolicy: Never
  backoffLimit: 4
