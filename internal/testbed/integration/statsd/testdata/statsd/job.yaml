apiVersion: batch/v1
kind: Job
metadata:
  name: statsd-generator-job
  namespace: e2estatsd
spec:
  template:
    spec:
      containers:
      - name: netcat
        image: alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
        command: ["/bin/sh", "-c"]
        args: [
          "echo 'test.metric:42|g|#myKey:myVal' | nc -u -w 1 -v otelcolsvc.e2estatsd.svc.cluster.local 8125 && \
           sleep 1 && \
           echo 'timerMetric:320|ms|@0.1|#timerKey:timerVal' | nc -u -w 1 -v otelcolsvc.e2estatsd.svc.cluster.local 8125"
        ]
      restartPolicy: Never
  backoffLimit: 4
